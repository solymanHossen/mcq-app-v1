version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 512m
    command:
      - postgres
      - -c
      - max_connections=40
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - work_mem=4MB
      - -c
      - wal_buffers=16MB
      - -c
      - min_wal_size=80MB
      - -c
      - max_wal_size=1GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
    environment:
      POSTGRES_USER: mcq
      POSTGRES_PASSWORD: mcq
      POSTGRES_DB: mcq_platform
    # প্রডাকশনে ডাটাবেস পোর্ট হোস্ট মেশিনে ওপেন রাখার দরকার নেই, নেটওয়ার্কের ভেতর দিয়ে অ্যাপ কথা বলবে
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - production_net
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U mcq -d mcq_platform' ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    mem_limit: 128m
    command: redis-server --maxmemory 96mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - production_net
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 5s
      timeout: 5s
      retries: 10

  mcq-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcq-app-production
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgresql://mcq:mcq@postgres:5432/mcq_platform?schema=public
      - REDIS_URL=redis://redis:6379
    volumes:
      - mcq_uploads:/app/public/uploads
    networks:
      - production_net

networks:
  production_net:
    external: true
    name: devops-stack_production_net # আপনার সার্ভারের বিদ্যমান ক্লাউডফ্লো টানেল নেটওয়ার্কের নাম

volumes:
  postgres-data:
  redis-data:
  mcq_uploads:
