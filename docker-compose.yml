services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mcq
      POSTGRES_PASSWORD: mcq
      POSTGRES_DB: mcq_platform
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mcq -d mcq_platform']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
